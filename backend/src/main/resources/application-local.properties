# LOCAL H2 DATABASE (file-based, persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/financedb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Local JWT secret (must be at least 32 bytes for HS256)
jwt.secret=local-dev-jwt-secret-key-at-least-32-bytes-long

# AI assistant (Groq, OpenAI-compatible API)
ai.base-url=${AI_BASE_URL:https://api.groq.com/openai/v1}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:openai/gpt-oss-120b}
ai.max-tokens=800