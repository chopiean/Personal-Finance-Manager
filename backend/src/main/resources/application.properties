spring.profiles.active=local
ai.api-key=
# Password reset: where reset links point, and the sender address.
# Emails are sent when SMTP is configured via SPRING_MAIL_HOST, SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD (+ starttls below). Without it the
# link is printed to the backend log instead.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.mail.from=${MAIL_FROM:no-reply@finance-manager.local}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
