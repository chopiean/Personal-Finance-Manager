# Isolated in-memory H2 database for tests.
# This intentionally overrides src/main/resources/application.properties on the
# test classpath so tests never touch the persisted dev DB file (./data/financedb).
spring.datasource.url=jdbc:h2:mem:testdb-${random.uuid};DB_CLOSE_DELAY=-1;MODE=LEGACY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false

jwt.secret=test-secret-not-for-production-32b
